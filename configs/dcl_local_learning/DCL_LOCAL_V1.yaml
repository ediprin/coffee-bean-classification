seed: 42
device: auto

data:
  root: data/coffee17-preprocessing-development
  source: source
  train_split: train
  val_split: val
  image_size: 224
  batch_size: 32
  workers: 4
  rotation_angles: [0, 45, 90, 135, 180, 225, 270]
  augmentation_mode: preprocessing_study
  object_crop: false

model:
  backbone: mobilenetv3_large_100
  pretrained: true
  head: hbp
  classifier: linear
  num_classes: 17
  out_indices: [1, 3, 4]
  projection_dim: 512
  dropout: 0.2

adaptation:
  method: source_only

training:
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0001
  classification_loss: cross_entropy
  label_smoothing: 0.1
  freeze_backbone: false
  scheduler: cosine
  ema_decay: 0.0
  ema_start_epoch: 0
  output_dir: outputs/dcl-local-learning-v1

dcl:
  implementation: local_rcm_dcl_style
  grid_size: 4
  neighbor_span: 2
  swap_task: binary_original_vs_shuffled
  location_loss: l1
  classification_weight: 1.0
  swap_weight: 1.0
  location_weight: 1.0
  validation_tuning: false

evaluation:
  hard_groups:
    withered_immature: [Withered, Immature]
    insect_severity: [Severe Insect Damage, Slight Insect Damage]
    cut_insect: [Cut, Slight Insect Damage]
    sour_extent: [Partial Sour, Full Sour]
    slight_fade: [Slight Insect Damage, Fade]
    black_extent: [Full Black, Partial Black]
  targeted_confusion_pairs:
    - [Withered, Immature]
    - [Severe Insect Damage, Slight Insect Damage]
    - [Cut, Slight Insect Damage]
    - [Partial Sour, Full Sour]
    - [Slight Insect Damage, Fade]
    - [Full Black, Partial Black]
