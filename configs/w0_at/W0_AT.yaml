seed: 42
device: auto
data:
  root: data/coffee17-preprocessing-development
  source: source
  train_split: train
  val_split: val
  image_size: 224
  batch_size: 32
  workers: 4
  rotation_angles: [0, 45, 90, 135, 180, 225, 270]
  augmentation_mode: preprocessing_study
  object_crop: false

model:
  backbone: mobilenetv3_large_100
  pretrained: true
  head: gap
  classifier: linear
  num_classes: 17
  out_indices: [3, 4]

adaptation:
  method: source_only

training:
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0001
  classification_loss: cross_entropy
  label_smoothing: 0.1
  freeze_backbone: false
  scheduler: cosine
  ema_decay: 0.0
  ema_start_epoch: 0
  output_dir: outputs/w0-at

preprocessing:
  enabled: true
  code: R0
  method: raw

attention_transfer:
  method: w0_spatial_attention_transfer
  teacher_view: W0
  teacher_stop_gradient: true
  selective_batch_norm: true
  attention_backbone_out_index: 3
  attention_feature_position: 0
  attention_power: 2
  channel_reduction: mean
  normalization: l2
  loss: mse_mean
  beta: 1000.0
  epoch1_weighted_at_to_ce_abort_ratio: 1.0
  teacher_frontend:
    enabled: true
    code: W0
    method: haar4_visushrink_soft_reconstruction
    wavelet_levels: 4
    eps: 1.0e-8
