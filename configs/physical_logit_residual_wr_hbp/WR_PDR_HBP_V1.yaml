seed: 42
device: auto

data:
  root: data/coffee17-preprocessing-development
  source: source
  train_split: train
  val_split: val
  image_size: 224
  batch_size: 32
  workers: 4
  rotation_angles: [0, 45, 90, 135, 180, 225, 270]
  augmentation_mode: preprocessing_study
  object_crop: false

model:
  backbone: mobilenetv3_large_100
  pretrained: true
  head: hbp
  classifier: linear
  num_classes: 17
  out_indices: [1, 3, 4]
  projection_dim: 512
  dropout: 0.2

adaptation:
  method: source_only

training:
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0001
  classification_loss: cross_entropy
  label_smoothing: 0.1
  freeze_backbone: false
  scheduler: cosine
  ema_decay: 0.0
  ema_start_epoch: 0
  output_dir: outputs/physical-logit-residual-wr-hbp

wavelet_residual:
  domain: luminance
  level: L1
  bands: [LH, HL, HH]
  threshold: visushrink_soft
  injection: shallow_residual
  hidden_channels: 16
  gate: tanh_zero_init
  eps: 1.0e-8

physical_logit_residual:
  base_model: WR_HBP
  base_model_frozen_during_residual_fit: true
  fusion: masked_additive_logit_residual
  features:
    - area_fraction
    - perimeter_over_sqrt_area
    - circularity
    - eccentricity
    - solidity
    - aspect_ratio
    - L_mean
    - warm_frac_a5_b10
    - L_frac_lt_50
  l2: 0.01
  label_smoothing: 0.1
  maxiter: 500
  fit_device: cpu_float64
  insect_topology_enabled: false
