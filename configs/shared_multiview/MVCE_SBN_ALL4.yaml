seed: 42
device: auto
data:
  root: data/coffee17-preprocessing-development
  source: source
  train_split: train
  val_split: val
  image_size: 224
  batch_size: 32
  workers: 4
  rotation_angles: [0, 45, 90, 135, 180, 225, 270]
  augmentation_mode: preprocessing_study
  object_crop: false

model:
  backbone: mobilenetv3_large_100
  pretrained: true
  head: gap
  num_classes: 17
  out_indices: [4]

adaptation:
  method: source_only

training:
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0001
  classification_loss: cross_entropy
  label_smoothing: 0.1
  freeze_backbone: false
  scheduler: cosine
  ema_decay: 0.0
  ema_start_epoch: 0
  output_dir: outputs/shared-multiview-sbn

preprocessing:
  enabled: true
  code: R0
  method: raw

multiview:
  method: shared_mvce_sbn
  views: [R0, C0, F0, W0]
  raw_weight: 0.5
  auxiliary_weight: 0.5
  normalization_strategy: selective_batch_stats
  deployment_bn_source: R0
  frontends:
    R0:
      enabled: true
      code: R0
      method: raw
    C0:
      enabled: true
      code: C0
      method: clahe_lab_luminance
      clip_limit: 2.0
      tile_grid_size: [8, 8]
    F0:
      enabled: true
      code: F0
      method: af2_luminance_shared_gate
      patch_size: 32
      overlap: 0.50
      gamma: 0.10
      angular_bins: 360
      chunk_size: 128
      eps: 1.0e-8
    W0:
      enabled: true
      code: W0
      method: haar4_visushrink_soft_reconstruction
      wavelet_levels: 4
      eps: 1.0e-8
