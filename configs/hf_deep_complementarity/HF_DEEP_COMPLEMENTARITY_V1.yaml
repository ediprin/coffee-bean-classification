seed: 42
device: auto

data:
  root: data/coffee17-hf-deep-development
  source: source
  train_split: train
  val_split: val
  image_size: 224
  batch_size: 32
  workers: 4
  rotation_angles: [0, 45, 90, 135, 180, 225, 270]
  augmentation_mode: preprocessing_study
  object_crop: false

model:
  backbone: mobilenetv3_large_100
  pretrained: true
  head: hbp
  classifier: linear
  num_classes: 17
  out_indices: [1, 3, 4]
  projection_dim: 512
  dropout: 0.2

training:
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0001
  classification_loss: cross_entropy
  label_smoothing: 0.1
  scheduler: cosine
  freeze_backbone: false

handcrafted:
  descriptor: tulsi_aligned_71
  selection: mrmr_difference
  selected_features: 20
  selection_fit: train_fold_only
  segmentation: project_background_distance_otsu
  augmentation_for_probe: false

probe:
  classifier: multinomial_logistic_regression
  C: 1.0
  solver: lbfgs
  max_iter: 5000
  deep_normalization: l2
  handcrafted_normalization: train_standardize_then_l2
  fusion_block_weighting: equal_l2_blocks
  validation_tuning: false

evaluation:
  hard_groups:
    withered_immature: [Withered, Immature]
    insect_severity: [Severe Insect Damage, Slight Insect Damage]
    cut_insect: [Cut, Slight Insect Damage]
    sour_extent: [Partial Sour, Full Sour]
    slight_fade: [Slight Insect Damage, Fade]
    black_extent: [Full Black, Partial Black]
  targeted_confusion_pairs:
    - [Withered, Immature]
    - [Severe Insect Damage, Slight Insect Damage]
    - [Cut, Slight Insect Damage]
    - [Partial Sour, Full Sour]
    - [Slight Insect Damage, Fade]
    - [Full Black, Partial Black]

screening_gate:
  mean_macro_delta_gt: 0.0
  macro_positive_folds_at_least: 4
  mean_hard_delta_gt: 0.0
  targeted_confusion_delta_lt: 0
  mean_worst_delta_ge: 0.0
