name: preprocessing-study-ci

on:
  push:
    branches:
      - codex/preprocessing-study-v1
      - codex/shared-multiview-v1
      - codex/shared-multiview-sbn-v1
      - codex/at-sbn-v1
      - codex/mvfd-sbn-v1
      - codex/hbp-mvfd-sbn-v1
      - codex/dcl-local-learning-v1
      - codex/hf-deep-complementarity-v1
      - codex/wr-hbp-final-confirmation-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install opencv-python-headless
      - name: Test
        run: |
          if [ "$GITHUB_REF_NAME" = "codex/dcl-local-learning-v1" ]; then
            python -m pytest -q \
              tests/engine/test_dcl_local_learning.py \
              tests/experiments/test_dcl_local_learning_runner.py
          elif [ "$GITHUB_REF_NAME" = "codex/hf-deep-complementarity-v1" ]; then
            python -m pytest -q \
              tests/features/test_tulsi_handcrafted.py \
              tests/experiments/test_hf_deep_complementarity.py
          elif [ "$GITHUB_REF_NAME" = "codex/wr-hbp-final-confirmation-v1" ]; then
            python -m pytest -q \
              tests/experiments/test_wr_hbp_final_confirmation.py
          else
            python -m pytest -q
          fi
